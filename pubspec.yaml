name: fvelox
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev.
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  # UI, platform and localization
  cupertino_icons: ^1.0.8
  flutter_localizations:
    sdk: flutter
  intl: 0.20.2
  flutter_floaty: ^0.2.0
  pinput: ^6.0.2

  # State management and dependency injection
  flutter_riverpod: 2.6.1
  riverpod: 2.6.1

  # Navigation
  go_router: ^17.5.0

  # Network and connectivity
  dio: ^5.11.1
  connectivity_plus: ^7.3.1

  # Serialization
  json_annotation: ^4.12.0

  # Local database and persistence
  drift: ^2.34.4
  drift_flutter: ^0.3.1

dev_dependencies:
  # Testing
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  patrol: ^4.10.0

  # Static analysis
  flutter_lints: ^6.0.0

  # Code generation
  drift_dev: ^2.34.0
  build_runner: ^2.15.1
  flutter_gen_runner: ^5.15.0
  json_serializable: ^6.14.1

  # App assets and native launch screen
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
flutter:

  generate: true
  uses-material-design: true

  assets:
    - assets/
    - assets/icons/

patrol:
  app_name: Fvlox
  test_directory: integration_test
  android:
    package_name: com.example.fvelox
  ios:
    bundle_id: com.example.fvelox
    app_name: Fvlox
